# Publishes both builds to the single GitHub Pages site this repository gets:
#
#   main branch  ->  https://<user>.github.io/<repo>/
#   beta branch  ->  https://<user>.github.io/<repo>/beta/
#
# Both are rebuilt on every run, so the published site always matches the two
# branches. A push to one never publishes stale content for the other.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Build production
        run: npm run build

      - name: Stash the production build
        run: mv dist "$RUNNER_TEMP/site"

      - name: Does a beta branch exist?
        id: beta
        run: |
          if git ls-remote --exit-code --heads origin beta >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No beta branch yet — publishing production only."
          fi

      - name: Check out beta
        if: steps.beta.outputs.exists == 'true'
        run: |
          git fetch origin beta --depth=1
          git checkout --force origin/beta

      - name: Build beta
        if: steps.beta.outputs.exists == 'true'
        env:
          VITE_APP_ENV: beta
        run: |
          npm ci
          npm test
          npm run build
          mv dist "$RUNNER_TEMP/site/beta"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
